<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOCO Korea</title>
<style>
:root{
  --ink:#121417; --muted:#70757d; --paper:#f4f3ef; --card:#fff; --line:#deded8;
  --red:#cd4c4c; --blue:#3b64a1; --green:#2f7a5a; --amber:#9b6c20;
  --shadow:0 16px 45px rgba(18,20,23,.07); --radius:26px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
header{position:sticky;top:0;z-index:50;background:rgba(244,243,239,.91);backdrop-filter:blur(14px);border-bottom:1px solid rgba(18,20,23,.06)}
nav{height:74px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-weight:900;letter-spacing:-.04em;font-size:21px}
.brand .red{color:var(--red)} .brand .blue{color:var(--blue)}
.navlinks{display:flex;align-items:center;gap:24px;color:#555b64;font-size:14px}
.hero{padding:72px 0 28px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:850}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
h1{font-size:clamp(58px,8.5vw,108px);line-height:.9;letter-spacing:-.075em;margin:18px 0 21px}
h1 span{color:var(--blue)}
.lead{max-width:760px;color:var(--muted);font-size:18px;line-height:1.65;margin:0}
.archive-section{padding:32px 0 86px}
.year-nav{display:flex;gap:10px;align-items:center;margin:10px 0 26px;position:sticky;top:88px;z-index:30;width:max-content;padding:6px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);box-shadow:0 8px 26px rgba(18,20,23,.06)}
.year-btn{border:0;background:transparent;color:#737981;border-radius:12px;padding:11px 18px;cursor:pointer;font-weight:900;font-size:14px}
.year-btn.active{background:var(--ink);color:#fff}
.year-panel{display:none}
.year-panel.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.year-head{display:flex;align-items:end;justify-content:space-between;gap:28px;margin-bottom:24px}
.year-head h2{font-size:46px;letter-spacing:-.055em;margin:0}
.year-head p{margin:0;max-width:575px;color:var(--muted);line-height:1.55}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.summary span{padding:7px 10px;background:#e9e8e2;border-radius:999px;color:#666b72;font-size:11px;font-weight:850}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{min-height:380px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:25px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(18,20,23,.035);transition:.2s ease}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card:before{content:"";position:absolute;width:165px;height:165px;border:3px solid var(--blue);border-radius:50%;right:-76px;top:-76px;opacity:.075;box-shadow:0 0 0 32px var(--blue),0 0 0 64px var(--blue)}
.card-top,.card-bottom{position:relative;z-index:1}
.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;background:#f1f1ed;color:#555b63}
.status.returning{background:#e8f3ed;color:var(--green)}
.status.tba{background:#f7f0e2;color:var(--amber)}
.status.archive{background:#edf1f6;color:var(--blue)}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor}
.place{margin-top:18px;font-size:12px;color:#777c84;font-weight:850;text-transform:uppercase;letter-spacing:.07em}
.card h3{font-size:27px;letter-spacing:-.045em;line-height:1.06;margin:8px 0 12px}
.meta{display:grid;gap:8px;margin-top:18px}
.row{display:flex;justify-content:space-between;gap:18px;border-top:1px solid #ecece7;padding-top:9px;font-size:13px}
.row span{color:var(--muted)}
.row b{text-align:right}
.note{margin-top:16px;background:#f6f6f2;border-radius:14px;padding:12px 13px;font-size:12px;line-height:1.48;color:#60666e}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:23px}
.btn{min-height:45px;padding:0 16px;border-radius:14px;border:1px solid var(--ink);background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:850;cursor:pointer}
.btn.secondary{background:#fff;color:var(--ink);border-color:var(--line)}
.prototype{font-size:11px;color:#8a8f96;margin-top:9px}
.info-strip{margin-top:34px;border:1px solid var(--line);background:#ecebe6;border-radius:22px;padding:20px;display:flex;justify-content:space-between;gap:24px}
.info-strip strong{font-size:14px}
.info-strip p{margin:4px 0 0;color:#686e76;font-size:12px;line-height:1.5;max-width:760px}
footer{padding:24px 0 55px;color:#81868d;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(15,17,20,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modalbox{width:min(500px,100%);background:#fff;border-radius:24px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modalbox h3{margin:0 0 8px;font-size:28px;letter-spacing:-.04em}
.modalbox p{margin:0 0 20px;color:var(--muted);line-height:1.55}
.close{float:right;border:0;background:#f0f0ec;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px}
.emailrow{display:flex;gap:8px}
.emailrow input{flex:1;min-width:0;height:44px;border:1px solid #d8d9d6;border-radius:12px;padding:0 12px;background:#fff}
.small{font-size:11px;color:#7c8188;margin-top:8px}
@media(max-width:960px){.cards{grid-template-columns:1fr 1fr}.navlinks{display:none}}
@media(max-width:640px){
 .wrap{width:min(100% - 24px,1180px)} .cards{grid-template-columns:1fr}
 .year-head{display:block}.year-head p{margin-top:10px}.year-nav{top:82px}
 .info-strip{display:block}.emailrow{display:grid}
}


.landing{min-height:calc(100vh - 74px);padding:54px 0 72px;background:#fff}
.landing-shell{width:100%}
.choices{display:flex;align-items:center;justify-content:space-between;gap:clamp(40px,10vw,150px);margin:0 auto 64px}
.choice{width:min(350px,34vw);aspect-ratio:4/5;min-height:0;background:#fff;border:1px solid var(--line);border-radius:30px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transition:.2s ease}
.choice:hover{transform:translateY(-5px);box-shadow:0 20px 56px rgba(18,20,23,.11)}
.choice h2{font-size:clamp(34px,4vw,48px);letter-spacing:-.055em;margin:14px 0 14px}
.choice p{color:var(--muted);line-height:1.6;margin:0}
.choice-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px;border-top:1px solid #ecece7;font-size:13px;font-weight:900}
.choice-foot span:last-child{font-size:20px;line-height:1}
.flag-stage{width:100%;padding-top:8px}
.flag-mosaic{display:grid;grid-template-columns:1.15fr 1fr 1.15fr;align-items:stretch;gap:8px;width:100%;aspect-ratio:4.58/1;opacity:.5}
.flag-side{height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;min-width:0}
.flag-cell{min-width:0;min-height:0;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.flag-cell img{width:100%;height:100%;object-fit:contain;display:block}
.flag-korea{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.flag-center{height:100%;min-width:0;display:flex;align-items:stretch}
@media(max-width:760px){
 .landing{padding:34px 0 54px}
 .choices{gap:16px;margin-bottom:44px}
 .choice{width:calc(50% - 8px);padding:20px;border-radius:24px}
 .choice h2{font-size:30px}
 .choice p{font-size:13px}
 .choice-foot{font-size:11px}
 .flag-mosaic{gap:4px}
 .flag-side{gap:3px}
}
@media(max-width:520px){
 .choices{align-items:stretch}
 .choice{padding:16px;border-radius:20px}
 .choice h2{font-size:25px}
 .choice p{display:none}
 .status{font-size:9px;padding:6px 8px}
 .flag-stage{overflow:hidden}
 .flag-mosaic{width:700px;max-width:none;position:relative;left:50%;transform:translateX(-50%)}
}
</style></head><body>
<header><div class="wrap"><nav><div class="brand"><span class="red">VOCO</span> <span class="blue">Korea</span></div></nav></div></header>
<main class="wrap landing"><div class="landing-shell">
<div class="choices" style="justify-content: space-evenly;">
  <div class="choice">
    <div><div class="status archive"><i></i>FREE</div><h2>Ride Korea</h2><p>Routes, rentals, stays, food, shops and transport.</p></div>
    <div class="choice-foot"><span>Content next</span><span>→</span></div>
  </div>
  <a class="choice" href="race-support.html">
    <div><div class="status returning"><i></i>CONCIERGE</div><h2>Events by year</h2><p>Browse the 2026 archive and 2027 upcoming race updates.</p></div>
    <div class="choice-foot"><span>Browse events</span><span>→</span></div>
  </a>
</div>

<section class="flag-stage" aria-label="Seorak Granfondo participating countries">
  <div class="flag-mosaic">
    <div class="flag-side flag-left">
      <div class="flag-cell"><img src="assets/flags/de.png" alt="Germany"></div>
      <div class="flag-cell"><img src="assets/flags/mx.png" alt="Mexico"></div>
      <div class="flag-cell"><img src="assets/flags/us.png" alt="United States"></div>
      <div class="flag-cell"><img src="assets/flags/dk.png" alt="Denmark"></div>
      <div class="flag-cell"><img src="assets/flags/no.png" alt="Norway"></div>
      <div class="flag-cell"><img src="assets/flags/za.png" alt="South Africa"></div>
      <div class="flag-cell"><img src="assets/flags/ph.png" alt="Philippines"></div>
      <div class="flag-cell"><img src="assets/flags/fi.png" alt="Finland"></div>
      <div class="flag-cell"><img src="assets/flags/fr.png" alt="France"></div>
    </div>
    <div class="flag-center"><img class="flag-korea" src="assets/flags/kr.png" alt="South Korea"></div>
    <div class="flag-side flag-right">
      <div class="flag-cell"><img src="assets/flags/br.png" alt="Brazil"></div>
      <div class="flag-cell"><img src="assets/flags/ch.png" alt="Switzerland"></div>
      <div class="flag-cell"><img src="assets/flags/es.png" alt="Spain"></div>
      <div class="flag-cell"><img src="assets/flags/ie.png" alt="Ireland"></div>
      <div class="flag-cell"><img src="assets/flags/gb.png" alt="United Kingdom"></div>
      <div class="flag-cell"><img src="assets/flags/id.png" alt="Indonesia"></div>
      <div class="flag-cell"><img src="assets/flags/ca.png" alt="Canada"></div>
      <div class="flag-cell"><img src="assets/flags/cn.png" alt="China"></div>
      <div class="flag-cell"><img src="assets/flags/zm.png" alt="Zambia"></div>
    </div>
  </div>
</section>
</div></main></body></html>
